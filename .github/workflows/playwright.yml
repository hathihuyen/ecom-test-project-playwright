name: Playwright Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "30 5 * * 1-5" # weekdays 05:30 UTC – away from the demo site's on-the-hour DB reset

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    quality:
        name: Type check, lint & format
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci # this install everything in clude TypeScript and Faker.js, ...
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check

    e2e:
        name: E2E tests
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            ALL_BROWSERS: ${{ github.event_name == 'schedule' && '1' || '' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Install Playwright browsers
              run: npx playwright install --with-deps ${{ env.ALL_BROWSERS && 'chromium firefox webkit' || 'chromium' }}
            - name: Run Playwright tests
              run: npx playwright test
              env:
                  BASE_URL: ${{ vars.BASE_URL }}
                  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
            - name: Upload HTML report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ github.run_attempt }}
                  path: playwright-report/
                  retention-days: 14
            - name: Upload traces and videos of failed tests
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ github.run_attempt }}
                  path: test-results/
                  retention-days: 7
